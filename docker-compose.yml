# Local development stack: mock services + gateway + admin app (pages and /admin/* API, ADR 0014).
#   docker compose up --build
# All four containers share one network namespace (the gateway's), so the sample config's
# "http://localhost:5100" service URLs work unchanged inside Docker.
#
#   http://localhost:5100/_stats   mock services (call counters)
#   http://localhost:5200/bff/...  gateway
#   http://localhost:5300          admin app (pages; /admin/* for scripts)
#
# DEVELOPMENT ONLY: uses the dev token issuer and mock secrets from appsettings.Development.json.
# Uses the sample data in samples/config. For your own config: AGGREGATOR_CONFIG=./config docker compose up

x-app: &app
  build: { context: . }
  environment: &env
    ASPNETCORE_ENVIRONMENT: Development
    Aggregator__Config__Directory: /config

services:
  gateway:
    <<: *app
    build: { context: ., args: { PROJECT: src/ApiAggregator.Gateway/ApiAggregator.Gateway.csproj } }
    command: ["ApiAggregator.Gateway.dll"]
    environment: { <<: *env, ASPNETCORE_URLS: "http://+:5200" }
    volumes: ["${AGGREGATOR_CONFIG:-./samples/config}:/config:ro"]
    ports: ["5100:5100", "5200:5200", "5300:5300"]

  mocks:
    <<: *app
    build: { context: ., args: { PROJECT: samples/MockServices/MockServices.csproj } }
    command: ["MockServices.dll"]
    environment: { <<: *env, ASPNETCORE_URLS: "http://+:5100" }
    network_mode: "service:gateway"

  admin:
    <<: *app
    build: { context: ., args: { PROJECT: src/ApiAggregator.Admin/ApiAggregator.Admin.csproj } }
    command: ["ApiAggregator.Admin.dll"]
    environment: { <<: *env, ASPNETCORE_URLS: "http://+:5300", Gateway__BaseUrl: "http://localhost:5200/" }
    volumes: ["${AGGREGATOR_CONFIG:-./samples/config}:/config"]
    network_mode: "service:gateway"
